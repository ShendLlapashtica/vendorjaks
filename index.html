<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- theme-color paints the Android/iOS browser chrome. It was #FF0000
         from the protest-poster palette; the app's ground is now the deep
         navy --navy-900 (src/index.css), and a red status bar above a navy
         page reads as a rendering bug on a phone. Keep these two in sync. -->
    <meta name="theme-color" content="#0B1222" />
    <meta name="description" content="Vendorja — skano barkodin, mëso ku është regjistruar, e nëse është nga Serbia, zbulo alternativën vendore. bleje tanen, jo te beogradit." />
    <!-- ICON SET, 2026-09-17. One SVG favicon is not a favicon set, and this
         app is a barcode scanner used one-handed in a shop — being
         installable to a home screen is the difference between "a site I
         visited once" and "the app I open in the aisle". -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG fallbacks for the browsers that still ignore SVG favicons.
         Generated by scripts/build-icons.mjs from the same geometry, because
         there is no rasteriser on this machine and a manifest pointing at a
         missing icon is worse than no manifest. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Matches --navy-900, so the browser chrome does not sit on a
         different colour to the page it frames. -->
    <meta name="theme-color" content="#14161a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vendorja" />

    <!-- SHARE CARD. Facebook, Instagram, WhatsApp and Viber all read these
         Open Graph tags; without them a shared link renders as a bare URL with
         no picture, which is what it was doing. og:image MUST be an absolute
         URL — relative paths are ignored by every one of these scrapers. The
         1.91:1 card is public/og-image.png; public/og-square.png exists for
         places that centre-crop to a square. Both are generated on the brand
         red with the real wordmark, so the preview looks like the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vendorja" />
    <meta property="og:locale" content="sq_AL" />
    <!-- og:url, canonical and the site-wide JSON-LD are injected into the
         BUILT copy of this file by scripts/build-seo.mjs, which also writes a
         per-route shell (skano.html, eksploro.html, pse.html, pyetje.html,
         b.html) with its own title and description. They are not written
         here because the value differs per route and this file is the
         template for all of them.

         2026-09-14: vendorja.com now resolves and serves the app, so it is
         the canonical host; vercel.json 308-redirects vendorja.vercel.app
         onto it and the share card above points at vendorja.com. If the
         custom domain is ever taken down, revert BOTH of those together. -->
    <meta property="og:title" content="Vendorja — bleje tanen, jo t'shkive!" />
    <meta
      property="og:description"
      content="Skano barkodin e produktit. Nëse është i regjistruar ose i zotëruar nga Serbia, Vendorja të tregon alternativën vendore nga Kosova dhe Shqipëria."
    />
    <meta property="og:image" content="https://vendorja.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://vendorja.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vendorja — skano barkodin, gjej alternativën vendore" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vendorja — bleje tanen, jo t'shkive!" />
    <meta
      name="twitter:description"
      content="Skano barkodin e produktit. Nëse është i regjistruar ose i zotëruar nga Serbia, Vendorja të tregon alternativën vendore nga Kosova dhe Shqipëria."
    />
    <meta name="twitter:image" content="https://vendorja.com/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- TYPE. Changed 2026-09-16 (was Inter Tight + Outfit + IBM Plex Mono).
         Archivo = display/poster (--stack), Geist = UI and body (--round),
         IBM Plex Mono = meta/labels/barcodes (--mono, kept deliberately).
         The reasoning, and the ë/ç coverage check that gates any font
         choice in an Albanian-language UI, are in src/index.css :root.
         All three are OFL and served from Google Fonts; every one has a
         real system fallback stack behind it in the CSS, so a blocked
         fonts.gstatic.com degrades to Helvetica/Arial rather than to
         nothing. `display=swap` keeps first paint from being invisible. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Vendorja — skano barkodin, gjej alternativën vendore</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
